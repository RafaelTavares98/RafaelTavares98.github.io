name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check src/

      - name: Pytest
        run: pytest src/tests/ -v

      - name: Install Lua tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks build-essential
          sudo luarocks install busted
          sudo luarocks install luacheck

      - name: Luacheck lint
        run: luacheck rate_cards/

      - name: Busted tests
        run: busted rate_cards/tests/test_rate_cards.lua

      - name: Docker build
        run: docker compose build
